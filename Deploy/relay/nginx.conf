# Include in the relay domain's TLS server block. Never log certificate query strings.
location = /relay {
    proxy_pass https://127.0.0.1:18443;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_ssl_server_name on;
    proxy_ssl_name relay.jintongshu.top;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /www/sites/relay.jintongshu.top/ssl/upstream-roots.pem;
    proxy_ssl_verify_depth 4;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    access_log off;
    limit_conn perip 32;
    limit_conn perserver 4096;
}

location = /ping { proxy_pass https://127.0.0.1:18443; access_log off; }
location = /generate_204 { proxy_pass http://127.0.0.1:18080; access_log off; }
