[package]
name = "anywhere-host"
version = "1.1.9"
edition = "2024"
license = "Apache-2.0"

[dependencies]
subtle = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
anywhere-transport = { path = "../transport" }
iroh = "=1.4.1"
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
hex = "0.4"
libc = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum"] }
rustix = { version = "1", features = ["fs", "process"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
iroh-relay = { version = "=1.4.1", features = ["server"] }
tokio = { version = "1", features = ["test-util"] }
